<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kanban</title>
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="h-full flex flex-col text-slate-800 ">
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex flex-col">
            <h1 class="text-5xl font-bold mb-3 text-indigo-600">Flowboard </h1>
            <p class="text-gray-500 text-lg">Suivi interne des tâches</p>
        </div>
        <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xl font-semibold "> +
            Nouvelle carte</button>
    </header>

    <section class="bg-white border-b border-slate-200 px-6 py-3 shadow-sm">
        <form id="form" class="flex items-center gap-3 justify-end  gap-10">
            <div class="">
                <input type="text" id="filter" placeholder="Rechercher une tâche..."
                    class="w-full px-3 py-2 text-lg  border border-slate-300 rounded-sm ">
            </div>

            <div>
                <select id="selection" class="px-4 py-2.5 text-lg border border-slate-300 rounded-sm">
                    <option value="">Toutes les priorités</option>
                    <option value="Faible">Basse</option>
                    <option value="Moyen">Moyenne</option>
                    <option value="Avancé">Haute</option>
                </select>
            </div>
            <button id="boutreset"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 pb-1.5 rounded-lg text-3xl font-semibold ">
                ⟲</button>
        </form>
    </section>



    <!-- <div class="grid grid-cols-1 md:grid-cols-3 gap-6 h-full items-start"></div>

  -->

     <main>
        <!-- mssg err chargement et videe caché -->
        <div id="errCharge" class=" bg-red-50  border-red-200 text-red-700 p-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-xl">⚠️</span>
                <span class="text-md font-medium">Une erreur est survenue lors du chargement des données.</span>
            </div>
            <button
                class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded-md text-sm font-semibold transition">
                Réessayer
            </button>
        </div>


        <div id="vide" class=" bg-yellow-50 border border-amber-200 text-yellow-800 p-4 text-center text-md">
            🔍 Aucun résultat ne correspond à votre recherche
        </div>


        <section class="flex-1 p-6 grid grid-cols-1 md:grid-cols-3 gap-6 items-start">

            <div class="space-y-4 ">
                <div class="w-full p-4 bg-white border border-slate-200 rounded-xl shadow-xs animate-pulse">
                    <div class="h-4 bg-slate-200 rounded-full w-48 mb-4"></div>
                    <div class="h-3 bg-slate-200 rounded-full mb-2.5"></div>
                    <div class="h-3 bg-slate-200 rounded-full mb-2.5"></div>
                    <div class="h-3 bg-slate-200 rounded-full w-3/4 mb-4"></div>
                    <div class="flex items-center pt-2 border-t border-slate-100">
                        <div class="w-8 h-8 bg-slate-200 rounded-full mr-3"></div>
                        <div class="flex-1">
                            <div class="h-3 bg-slate-200 rounded-full w-24 mb-1.5"></div>
                            <div class="h-2.5 bg-slate-200 rounded-full w-16"></div>
                        </div>
                    </div>
                </div>
            </div>



            <div class="space-y-4">
                <div class="w-full p-4 bg-white border border-slate-200 rounded-xl shadow-xs animate-pulse">
                    <div class="h-4 bg-slate-200 rounded-full w-48 mb-4"></div>
                    <div class="h-3 bg-slate-200 rounded-full mb-2.5"></div>
                    <div class="h-3 bg-slate-200 rounded-full mb-2.5"></div>
                    <div class="h-3 bg-slate-200 rounded-full w-3/4 mb-4"></div>
                    <div class="flex items-center pt-2 border-t border-slate-100">
                        <div class="w-8 h-8 bg-slate-200 rounded-full mr-3"></div>
                        <div class="flex-1">
                            <div class="h-3 bg-slate-200 rounded-full w-24 mb-1.5"></div>
                            <div class="h-2.5 bg-slate-200 rounded-full w-16"></div>
                        </div>
                    </div>
                </div>
            </div>


            <div class="space-y-4">
                <div class="w-full p-4 bg-white border border-slate-200 rounded-xl shadow-xs animate-pulse">
                    <div class="h-4 bg-slate-200 rounded-full w-48 mb-4"></div>
                    <div class="h-3 bg-slate-200 rounded-full mb-2.5"></div>
                    <div class="h-3 bg-slate-200 rounded-full mb-2.5"></div>
                    <div class="h-3 bg-slate-200 rounded-full w-3/4 mb-4"></div>
                    <div class="flex items-center pt-2 border-t border-slate-100">
                        <div class="w-8 h-8 bg-slate-200 rounded-full mr-3"></div>
                        <div class="flex-1">
                            <div class="h-3 bg-slate-200 rounded-full w-24 mb-1.5"></div>
                            <div class="h-2.5 bg-slate-200 rounded-full w-16"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>
</body>

</html>
