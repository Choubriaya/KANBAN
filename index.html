<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kanban</title>
    <script src="api.js" defer type="module"></script>
    <script src="ui.js" defer type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="h-full flex flex-col text-slate-800 ">
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex flex-col">
            <h1 class="text-5xl font-bold mb-3 text-indigo-600">Flowboard </h1>
            <p class="text-gray-500 text-lg">Suivi interne des tâches</p>
        </div>
        <button id="nouvelleCarte" type="button"
            class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xl font-semibold "> +
            Nouvelle carte</button>
    </header>

    <section class="bg-white border-b border-slate-200 px-6 py-3 shadow-sm">
        <form id="form" class="flex items-center gap-3 justify-end  gap-10">
            <div class="">
                <input type="text" id="chercher" placeholder="Rechercher une tâche..."
                    class="w-full px-3 py-2 text-lg  border border-slate-300 rounded-sm ">
            </div>

            <div>
                <select id="selection" class="px-4 py-2.5 text-lg border border-slate-300 rounded-sm">
                    <option value="">Toutes les priorités</option>
                    <option value="low">Basse</option>
                    <option value="medium">Moyenne</option>
                    <option value="high">Haute</option>
                </select>
            </div>

            <div>
                <select id="assigne" class="px-4 py-2.5 text-lg border border-slate-300 rounded-sm">
                    <option value="">Tous les assignés</option>
                </select>
            </div>

            <button id="boutreset"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 pb-1.5 rounded-lg text-3xl font-semibold ">
                ⟲</button>
        </form>
    </section>

    <main>
        <!-- mssg err chargement et videe caché -->
        <div id="errCharge" class="hidden bg-red-50  border-red-200 text-red-700 p-4 flex items-center justify-between">
            <div class="flex items-center pl-10">
                <span class="text-2xl">⚠️</span>
                <span class="text-xl  pl-3">Une erreur est survenue lors du chargement des données.</span>
            </div>
            <button id="réessayer"
                class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded-md text-lg font-semibold transition">
                Réessayer
            </button>
        </div>


        <div id="vide" class="hidden bg-yellow-50 border border-amber-200 text-yellow-800 p-4 text-center text-md">
            🔍 Aucun résultat ne correspond à votre recherche
        </div>


        <section id="chargement" class=" hidden flex-1 p-6 grid grid-cols-1 md:grid-cols-3 gap-6 items-start">

            <div class="space-y-4 ">
                <div class="w-full p-4 bg-white border border-slate-200 rounded-xl shadow-xs animate-pulse">
                    <div class="h-4 bg-slate-200 rounded-full w-48 mb-4"></div>
                    <div class="h-3 bg-slate-200 rounded-full mb-2.5"></div>
                    <div class="h-3 bg-slate-200 rounded-full mb-2.5"></div>
                    <div class="h-3 bg-slate-200 rounded-full w-3/4 mb-4"></div>
                    <div class="flex items-center pt-2 border-t border-slate-100">
                        <div class="w-8 h-8 bg-slate-200 rounded-full mr-3"></div>
                        <div class="flex-1">
                            <div class="h-3 bg-slate-200 rounded-full w-24 mb-1.5"></div>
                            <div class="h-2.5 bg-slate-200 rounded-full w-16"></div>
                        </div>
                    </div>
                </div>
            </div>



            <div class="space-y-4">
                <div class="w-full p-4 bg-white border border-slate-200 rounded-xl shadow-xs animate-pulse">
                    <div class="h-4 bg-slate-200 rounded-full w-48 mb-4"></div>
                    <div class="h-3 bg-slate-200 rounded-full mb-2.5"></div>
                    <div class="h-3 bg-slate-200 rounded-full mb-2.5"></div>
                    <div class="h-3 bg-slate-200 rounded-full w-3/4 mb-4"></div>
                    <div class="flex items-center pt-2 border-t border-slate-100">
                        <div class="w-8 h-8 bg-slate-200 rounded-full mr-3"></div>
                        <div class="flex-1">
                            <div class="h-3 bg-slate-200 rounded-full w-24 mb-1.5"></div>
                            <div class="h-2.5 bg-slate-200 rounded-full w-16"></div>
                        </div>
                    </div>
                </div>
            </div>


            <div class="space-y-4">
                <div class="w-full p-4 bg-white border border-slate-200 rounded-xl shadow-xs animate-pulse">
                    <div class="h-4 bg-slate-200 rounded-full w-48 mb-4"></div>
                    <div class="h-3 bg-slate-200 rounded-full mb-2.5"></div>
                    <div class="h-3 bg-slate-200 rounded-full mb-2.5"></div>
                    <div class="h-3 bg-slate-200 rounded-full w-3/4 mb-4"></div>
                    <div class="flex items-center pt-2 border-t border-slate-100">
                        <div class="w-8 h-8 bg-slate-200 rounded-full mr-3"></div>
                        <div class="flex-1">
                            <div class="h-3 bg-slate-200 rounded-full w-24 mb-1.5"></div>
                            <div class="h-2.5 bg-slate-200 rounded-full w-16"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>


        <section id="tableau" class=" flex-1 p-6 grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
            <div class="bg-slate-100 rounded-xl p-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-slate-700"> À faire</h2>
                    <span id="cptTodo" class="bg-slate-200 text-slate-700 px-3 py-1 rounded-full font-semibold">
                        0
                    </span>
                </div>
                <div id="colTodo" class="space-y-4 min-h-20">

                </div>

            </div>

            <div class="bg-slate-100 rounded-xl p-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-slate-700">En cours</h2>
                    <span id="cptEncour" class="bg-slate-200 text-slate-700 px-3 py-1 rounded-full font-semibold">
                        0
                    </span>
                </div>
                <div id="colEncour" class="space-y-4 min-h-20">

                </div>

            </div>



            <div class="bg-slate-100 rounded-xl p-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-slate-700">Terminé </h2>
                    <span id="cptDone" class="bg-slate-200 text-slate-700 px-3 py-1 rounded-full font-semibold">
                        0
                    </span>
                </div>
                <div id="colDone" class="space-y-4 min-h-20">

                </div>

            </div>

        </section>

    </main>
    <dialog id="popUp" class="w-full max-w-lg rounded-xl shadow-xl p-6 backdrop:bg-black/50">

        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold text-indigo-600">
                Nouvelle Carte
            </h2>

            <button id="close" class="text-gray-500 hover:text-red-600 text-2xl">
                ×
            </button>
        </div>
        <form id="formDialog" class="space-y-4">

            <div>
                <label class="block font-semibold mb-1">
                    Votre tâche*

                    <input type="text" id="titre" name="titre" placeholder="Ex : Créer une page de connexion"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                        <p class="err  text-red-500 text-sm hidden">Le titre doit contenir entre 3 et 50 caractères.</p>
                </label>
            </div>


            <div>
                <label class="font-semibold mb-1">
                    Description*
                    <textarea name="description" id="description" placeholder="Décrivez votre tâche..." rows="3"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg resize-none">
                        </textarea>
                        <p class=" err text-red-500 text-sm hidden">La description doit contenir entre 5 et 300 caractères.</p>
                </label>
            </div>


            <div>
                <label class=" font-semibold mb-1">
                    Priorité*

                    <select id="prioriteCarte" name="priorite"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                        <option value="">Choisir une priorité</option>
                        <option value="low">Basse</option>
                        <option value="medium">Moyenne</option>
                        <option value="high">Haute</option>
                    </select>
                    <p class=" err text-red-500 text-sm hidden">Veuillez choisir une priorité.</p>
                </label>
            </div>
            


            <div>
                <label class=" font-semibold mb-1">
                    Assigné à *

                    <input type="text" id="assigneCarte" placeholder="Ex : Sara"
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                        <p class="err text-red-500 text-sm hidden">Le nom doit contenir entre 2 et 30 caractères.</p>
                </label>

            </div>

            <div>
                <label class="block font-semibold mb-1">
                    Statut *

                    <select id="statutCarte" class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                        <option value="">Choisir un statut</option>
                        <option value="todo">À faire</option>
                        <option value="in-progress">En cours</option>
                        <option value="done">Terminé</option>
                    </select>
                    <p class="err text-red-500 text-sm hidden">Veuillez choisir un statut.</p>
                </label>
            </div>

             <div>
                <label class="block font-semibold mb-1">
                    Date*
                <input type="date" id="date" class="w-full border border-gray-300 rounded-lg p-3 bg-white mb-2">
                <p class=" err text-red-500 text-sm"></p>
                </label>
            </div>


            <div class="flex justify-end gap-3 pt-4">

                <button id="annuler" type="button"
                    class="px-4 py-2 border border-slate-300 rounded-lg hover:bg-slate-100">
                    Annuler
                </button>

                <button type="submit" id="creer"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-semibold">
                    Créer la carte
                </button>

            </div>

        </form>
    </dialog>

</body>

</html>
